[project]
name = "farm-grpo"
version = "0.1.0"
description = "Workshop: training Qwen with GRPO to pick farm-operations tools (dummy data)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "trl",
    "safetensors",
    "huggingface-hub",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
]

[dependency-groups]
dev = ["ipykernel", "jupyterlab", "nbformat", "nbconvert", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farm_grpo"]

# GB10 (DGX Spark) is aarch64 + CUDA 13 -> PyTorch cu130 wheels.
# On Colab / x86 just `pip install -e .` (the default PyPI torch is fine).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
