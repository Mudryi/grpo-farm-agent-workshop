[project]
name = "farm-grpo"
version = "0.1.0"
description = "Workshop: training Qwen with GRPO to pick farm-operations tools (dummy data)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "transformers>=5.23,<6",
    "datasets",
    "accelerate",
    "peft>=0.21,<1",
    "trl==1.18.1",               # GRPOTrainer API changes between releases
    "safetensors",
    "huggingface-hub",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
]

[dependency-groups]
dev = ["ipykernel", "jupyterlab", "nbformat", "nbconvert", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farm_grpo"]

# uv installs PyTorch CUDA 13 wheels (needs NVIDIA driver >= 580).
# Older driver: change the url below to .../whl/cu128, or just `pip install -e .` (default PyPI torch).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
